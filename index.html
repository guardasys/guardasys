<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GuardaSys — TOKU Importados</title>

  <!-- Tipografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />

  <!-- Estilos -->
  <link rel="stylesheet" href="css/styles.css" />

  <!-- React 18 (CDN, sin build) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone — PINNEADO a una versión estable de Babel 7. NO subir a "latest" (Babel 8 cambia defaults de runtime automático y rompe estos scripts no-módulo). -->
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <!-- Firebase compat SDK (permite usar la API global `firebase.*` sin bundler/ES modules) — pinneado a la versión entregada por la consola de Firebase -->
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-analytics-compat.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Config e inicialización de Firebase (JS plano, sin JSX) -->
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase-init.js"></script>

  <!-- Componentes y app (JSX vía Babel Standalone, transpilado en el navegador) -->
  <script type="text/babel" data-presets="react" src="js/components.js"></script>
  <script type="text/babel" data-presets="react" src="js/app.js"></script>
</body>
</html>
